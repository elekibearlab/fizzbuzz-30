<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FizzBuzz 30 Compare</title>
<link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #656d76;
  --border: #d8dee4;
  --accent: #0969da;
  --accent-bg: #ddf4ff;
  --gutter: #8c959f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --muted: #8d96a0;
    --border: #30363d;
    --accent: #4493f8;
    --accent-bg: #12263f;
    --gutter: #6e7681;
  }
}
@media (prefers-color-scheme: dark) {
  img.logo { background: #e6edf3; border-radius: 5px; padding: 2px; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
}
header {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
h1 { margin: 0 0 8px; font-size: 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 4px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.btn { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
.count { color: var(--muted); }
.picker { display: flex; flex-wrap: wrap; gap: 6px; max-height: 30vh; overflow-y: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 10px 3px 6px; cursor: pointer; user-select: none;
  background: var(--panel);
}
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip .year { color: var(--muted); font-weight: 400; font-size: 12px; }
.logo { width: 20px; height: 20px; flex: none; object-fit: contain; }
.logo.text {
  display: inline-grid; place-items: center;
  border-radius: 4px; background: var(--border); color: var(--text);
  font-size: 9px; font-weight: 700;
}
main { padding: 16px; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.columns { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.col {
  flex: 1 0 340px; min-width: 0;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden;
}
.col-head { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col-head .logo { width: 32px; height: 32px; }
.col-head .logo.text { font-size: 12px; }
.col-title { font-weight: 700; font-size: 15px; }
.col-meta { color: var(--muted); font-size: 12px; }
.col-close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
.code { display: flex; overflow-x: auto; font: 13px/1.55 "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace; }
.code pre { margin: 0; padding: 10px 12px; }
.code pre, .code code { font: inherit; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
.gutter { color: var(--gutter); text-align: right; user-select: none; border-right: 1px solid var(--border); }
.code pre code.hljs { padding: 0; background: transparent; }
.file { color: var(--muted); font-size: 12px; padding: 6px 12px; border-top: 1px solid var(--border); }
@media (max-width: 720px) {
  header { position: static; }
  .seg .note { display: none; }
  .seg button { padding: 4px 10px; }
  .columns { flex-direction: column; overflow-x: visible; }
  .col { flex: none; width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>FizzBuzz in 30 languages</h1>
  <div class="toolbar">
    <div class="seg" id="version" role="group" aria-label="版">
      <button data-v="aligned">aligned<span class="note">（判定順をそろえた版）</span></button>
      <button data-v="idiomatic">idiomatic<span class="note">（言語らしい書き方）</span></button>
    </div>
    <div class="seg" id="sort" role="group" aria-label="並び順">
      <button data-s="year">公開年順</button>
      <button data-s="name">名前順</button>
      <button data-s="lines">行数順</button>
    </div>
    <button class="btn" id="clear">全解除</button>
    <span class="count" id="count"></span>
  </div>
  <div class="picker" id="picker"></div>
</header>
<main>
  <div class="columns" id="columns"></div>
  <p class="empty" id="empty" hidden>上の一覧から言語を選ぶと、ここに並びます。</p>
</main>

<script id="data" type="application/json">/*__DATA__*/[]</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scala.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/julia.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/fortran.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/haskell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/elixir.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/erlang.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/prolog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/lisp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scheme.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/brainfuck.min.js"></script>
<script>
(function () {
  const LANGS = JSON.parse(document.getElementById("data").textContent);
  const bySlug = new Map(LANGS.map((l) => [l.slug, l]));
  const DEFAULT = ["c", "python", "cobol"];
  const state = { version: "aligned", sort: "year", selected: [] };

  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const v = p.get("v");
    state.version = v === "idiomatic" ? "idiomatic" : "aligned";
    const s = p.get("s");
    state.sort = ["year", "name", "lines"].includes(s) ? s : "year";
    const l = p.get("l");
    state.selected = (l === null ? DEFAULT : l.split(",")).filter((x) => bySlug.has(x));
  }
  function writeHash() {
    const h = "v=" + state.version + "&s=" + state.sort + "&l=" + state.selected.join(",");
    history.replaceState(null, "", "#" + h);
  }

  function logoEl(lang, cls) {
    if (lang.logo) {
      const img = document.createElement("img");
      img.className = "logo" + (cls ? " " + cls : "");
      img.src = lang.logo;
      img.alt = "";
      return img;
    }
    const span = document.createElement("span");
    span.className = "logo text" + (cls ? " " + cls : "");
    span.textContent = lang.name.slice(0, 2).toUpperCase();
    span.setAttribute("aria-hidden", "true");
    return span;
  }

  function sorted() {
    const list = LANGS.slice();
    if (state.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "en"));
    else if (state.sort === "lines") list.sort((a, b) =>
      (a.sources[state.version].lines ?? 1e9) - (b.sources[state.version].lines ?? 1e9) || a.year - b.year);
    else list.sort((a, b) => a.year - b.year || a.name.localeCompare(b.name, "en"));
    return list;
  }

  function renderPicker() {
    const picker = document.getElementById("picker");
    picker.replaceChildren();
    for (const lang of sorted()) {
      const label = document.createElement("label");
      label.className = "chip";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = state.selected.includes(lang.slug);
      input.addEventListener("change", () => {
        if (input.checked) state.selected.push(lang.slug);
        else state.selected = state.selected.filter((s) => s !== lang.slug);
        update();
      });
      const name = document.createElement("span");
      name.textContent = lang.name;
      const year = document.createElement("span");
      year.className = "year";
      year.textContent = state.sort === "lines"
        ? (lang.sources[state.version].lines ?? "-") + " 行"
        : String(lang.year);
      label.append(input, logoEl(lang), name, year);
      picker.append(label);
    }
  }

  function renderColumns() {
    const cols = document.getElementById("columns");
    cols.replaceChildren();
    const order = sorted().map((l) => l.slug).filter((s) => state.selected.includes(s));
    for (const slug of order) {
      const lang = bySlug.get(slug);
      const src = lang.sources[state.version];
      const col = document.createElement("section");
      col.className = "col";

      const head = document.createElement("div");
      head.className = "col-head";
      const info = document.createElement("div");
      const title = document.createElement("div");
      title.className = "col-title";
      title.textContent = lang.name;
      const meta1 = document.createElement("div");
      meta1.className = "col-meta";
      meta1.textContent = lang.year + " 年 · " + lang.designer;
      const meta2 = document.createElement("div");
      meta2.className = "col-meta";
      meta2.textContent = (src.lines ?? "-") + " 行 · " + (src.chars ?? "-") + " 文字（空白除く）";
      info.append(title, meta1, meta2);
      const close = document.createElement("button");
      close.className = "col-close";
      close.textContent = "×";
      close.setAttribute("aria-label", lang.name + " を外す");
      close.addEventListener("click", () => {
        state.selected = state.selected.filter((s) => s !== slug);
        update();
      });
      head.append(logoEl(lang), info, close);

      const code = src.code.replace(/\n$/, "");
      const box = document.createElement("div");
      box.className = "code";
      const gutter = document.createElement("pre");
      gutter.className = "gutter";
      gutter.textContent = code.split("\n").map((_, i) => i + 1).join("\n");
      const pre = document.createElement("pre");
      const el = document.createElement("code");
      el.className = "hljs";
      if (window.hljs && lang.hljs && hljs.getLanguage(lang.hljs)) {
        el.innerHTML = hljs.highlight(code, { language: lang.hljs, ignoreIllegals: true }).value;
      } else {
        el.textContent = code;
      }
      pre.append(el);
      box.append(gutter, pre);

      const file = document.createElement("div");
      file.className = "file";
      file.textContent = src.file;

      col.append(head, box, file);
      cols.append(col);
    }
    document.getElementById("empty").hidden = order.length > 0;
    document.getElementById("count").textContent = order.length + " / " + LANGS.length + " 言語";
  }

  function renderToolbar() {
    for (const b of document.querySelectorAll("#version button"))
      b.setAttribute("aria-pressed", String(b.dataset.v === state.version));
    for (const b of document.querySelectorAll("#sort button"))
      b.setAttribute("aria-pressed", String(b.dataset.s === state.sort));
  }

  function update() {
    writeHash();
    renderToolbar();
    renderPicker();
    renderColumns();
  }

  document.getElementById("version").addEventListener("click", (e) => {
    const v = e.target.closest("button")?.dataset.v;
    if (v) { state.version = v; update(); }
  });
  document.getElementById("sort").addEventListener("click", (e) => {
    const s = e.target.closest("button")?.dataset.s;
    if (s) { state.sort = s; update(); }
  });
  document.getElementById("clear").addEventListener("click", () => {
    state.selected = [];
    update();
  });
  window.addEventListener("hashchange", () => { readHash(); update(); });

  readHash();
  update();
})();
</script>
</body>
</html>
