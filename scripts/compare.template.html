<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #656d76;
  --border: #d8dee4;
  --accent: #0969da;
  --accent-bg: #ddf4ff;
  --gutter: #8c959f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --muted: #8d96a0;
    --border: #30363d;
    --accent: #4493f8;
    --accent-bg: #12263f;
    --gutter: #6e7681;
  }
}
@media (prefers-color-scheme: dark) {
  img.logo { background: #e6edf3; border-radius: 5px; padding: 2px; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
}
header {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
h1 { margin: 0 0 8px; font-size: 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 4px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.btn { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
.count { color: var(--muted); }
.picker { display: flex; flex-wrap: wrap; gap: 6px; max-height: 30vh; overflow-y: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 6px; flex-wrap: wrap; max-width: 100%;
  background: var(--panel);
}
.chip button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip .year { color: var(--muted); font-weight: 400; font-size: 12px; }
.logo { width: 20px; height: 20px; flex: none; object-fit: contain; }
.logo.text {
  display: inline-grid; place-items: center;
  border-radius: 4px; background: var(--border); color: var(--text);
  font-size: 9px; font-weight: 700;
}
main { padding: 16px; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.columns { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; padding-bottom: 8px; }
.col {
  flex: 1 0 auto; width: max(300px, var(--code-width));
  min-width: min(100%, max(300px, var(--code-width))); max-width: 100%;
  font: 13px/1.55 "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden;
}
.col-head { font-family: system-ui, sans-serif; overflow-wrap: anywhere; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col-head .logo { width: 32px; height: 32px; }
.col-head .logo.text { font-size: 12px; }
.col-title { font-weight: 700; font-size: 15px; }
.col-meta { color: var(--muted); font-size: 12px; }
.col-close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
.code { display: flex; overflow-x: auto; font: 13px/1.55 "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace; }
.code pre { flex: none; margin: 0; padding: 10px 12px; }
.code pre, .code code { font: inherit; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
.gutter { color: var(--gutter); text-align: right; user-select: none; border-right: 1px solid var(--border); }
.code pre code.hljs { padding: 0; background: transparent; }
.file { overflow-wrap: anywhere; font-family: system-ui, sans-serif; color: var(--muted); font-size: 12px; padding: 6px 12px; border-top: 1px solid var(--border); }
@media (max-width: 720px) {
  header { position: static; }
  .seg .note { display: none; }
  .seg button { padding: 4px 10px; }
}
</style>
</head>
<body>
<header>
  <h1 data-i18n="heading"></h1>
  <div class="toolbar">
    <div class="seg" id="sort" role="group" data-i18n-aria="sort">
      <button data-s="year" data-i18n="sortYear"></button>
      <button data-s="name" data-i18n="sortName"></button>
      <button data-s="lines" data-i18n="sortLines"></button>
    </div>
    <button class="btn" id="all-aligned" data-i18n="selectAligned"></button>
    <button class="btn" id="all-idiomatic" data-i18n="selectIdiomatic"></button>
    <button class="btn" id="all" data-i18n="selectAll"></button>
    <button class="btn" id="clear" data-i18n="clearAll"></button>
    <span class="count" id="count"></span>
  </div>
  <div class="picker" id="picker"></div>
</header>
<main>
  <div class="columns" id="columns"></div>
  <p class="empty" id="empty" data-i18n="empty" hidden></p>
</main>

<script id="data" type="application/json">/*__DATA__*/[]</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dos.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/julia.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/fortran.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/haskell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/elixir.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/erlang.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/prolog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/lisp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scheme.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/brainfuck.min.js"></script>
<script>
(function () {
  const messages = {
    ja: {
      "title": "FizzBuzz 30言語比較",
      "heading": "30言語のFizzBuzz",
      "version": "版",
      "sort": "並び順",
      "aligned": "そろえた版",
      "alignedNote": "（判定順をそろえた版）",
      "idiomatic": "個性全開版",
      "idiomaticNote": "（言語らしい書き方）",
      "sortYear": "公開年順",
      "sortName": "名前順",
      "sortLines": "行数順",
      "clearAll": "全解除",
      "empty": "上の一覧から言語を選ぶと、ここに並びます。",
      "selectAligned": "aligned を全部選ぶ",
      "selectIdiomatic": "idiomatic を全部選ぶ",
      "selectAll": "全選択（両方）",
      lines: (n) => `${n} 行`,
      metadata: (year, designer) => `${year} 年 · ${designer}`,
      stats: (lines, chars) => `${lines} 行 · ${chars} 文字（空白除く）`,
      remove: (name) => `${name} を外す`,
      count: (selected, total) => `${selected} / ${total} 列`,
      close: "×"
    },
    en: {
      "title": "FizzBuzz 30 Compare",
      "heading": "FizzBuzz in 30 languages",
      "version": "Version",
      "sort": "Sort order",
      "aligned": "aligned",
      "alignedNote": " (same condition order)",
      "idiomatic": "idiomatic",
      "idiomaticNote": " (natural style for each language)",
      "sortYear": "By release year",
      "sortName": "By name",
      "sortLines": "By line count",
      "selectAligned": "Select all aligned",
      "selectIdiomatic": "Select all idiomatic",
      "selectAll": "Select all (both)",
      "clearAll": "Clear all",
      "empty": "Select language and version pairs from the list above to compare them here.",
      lines: (n) => `${n} lines`,
      metadata: (year, designer) => `${year} · ${designer}`,
      stats: (lines, chars) => `${lines} lines · ${chars} characters (excluding whitespace)`,
      remove: (name) => `Remove ${name}`,
      count: (selected, total) => `${selected} / ${total} columns`,
      close: "×"
    }
  };
  const requestedLang = new URLSearchParams(location.search).get("lang");
  const locale = ["ja", "en"].includes(requestedLang)
    ? requestedLang : (navigator.language.toLowerCase().startsWith("ja") ? "ja" : "en");
  const t = messages[locale];
  document.documentElement.lang = locale;
  for (const el of document.querySelectorAll("[data-i18n]"))
    el.textContent = t[el.dataset.i18n];
  for (const el of document.querySelectorAll("[data-i18n-aria]"))
    el.setAttribute("aria-label", t[el.dataset.i18nAria]);

  const LANGS = JSON.parse(document.getElementById("data").textContent);
  const bySlug = new Map(LANGS.map((l) => [l.slug, l]));
  const DEFAULT = ["c", "python", "cobol"];
  const VERSIONS = ["aligned", "idiomatic"];
  const key = (slug, version) => `${slug}:${version}`;
  const state = { sort: "year", selected: [] };

  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const s = p.get("s");
    state.sort = ["year", "name", "lines"].includes(s) ? s : "year";
    let pairs;
    if (p.has("p")) pairs = p.get("p").split(",");
    else if (p.has("l") || p.has("v")) {
      const version = p.get("v") === "idiomatic" ? "idiomatic" : "aligned";
      pairs = (p.has("l") ? p.get("l").split(",") : DEFAULT).map((slug) => key(slug, version));
    } else pairs = DEFAULT.flatMap((slug) => VERSIONS.map((v) => key(slug, v)));
    state.selected = [...new Set(pairs)].filter((pair) => {
      const [slug, version] = pair.split(":");
      return bySlug.has(slug) && VERSIONS.includes(version) && pair === key(slug, version);
    });
  }
  function writeHash() {
    history.replaceState(null, "", "#s=" + state.sort + "&p=" + state.selected.join(","));
  }

  function logoEl(lang, cls) {
    if (lang.logo) {
      const img = document.createElement("img");
      img.className = "logo" + (cls ? " " + cls : "");
      img.src = lang.logo;
      img.alt = "";
      return img;
    }
    const span = document.createElement("span");
    span.className = "logo text" + (cls ? " " + cls : "");
    span.textContent = lang.name.slice(0, 2).toUpperCase();
    span.setAttribute("aria-hidden", "true");
    return span;
  }

  function sorted() {
    const list = LANGS.slice();
    if (state.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "en"));
    else list.sort((a, b) => a.year - b.year || a.name.localeCompare(b.name, "en"));
    return list;
  }

  function renderPicker() {
    const picker = document.getElementById("picker");
    picker.replaceChildren();
    for (const lang of sorted()) {
      const label = document.createElement("div");
      label.className = "chip";
      const name = document.createElement("span");
      name.textContent = lang.name;
      const year = document.createElement("span");
      year.className = "year";
      year.textContent = String(lang.year);
      label.append(logoEl(lang), name, year);
      for (const version of VERSIONS) {
        const pair = key(lang.slug, version);
        const button = document.createElement("button");
        button.className = "btn";
        button.textContent = t[version];
        button.setAttribute("aria-label", `${lang.name}: ${t[version]}`);
        button.setAttribute("aria-pressed", String(state.selected.includes(pair)));
        button.addEventListener("click", () => {
          if (state.selected.includes(pair)) state.selected = state.selected.filter((p) => p !== pair);
          else state.selected.push(pair);
          update();
        });
        label.append(button);
      }
      picker.append(label);
    }
  }

  function renderColumns() {
    const cols = document.getElementById("columns");
    cols.replaceChildren();
    const order = sorted().flatMap((lang) => VERSIONS
      .filter((v) => state.selected.includes(key(lang.slug, v)))
      .map((version) => ({ lang, version, src: lang.sources[version] })));
    if (state.sort === "lines") order.sort((a, b) =>
      (a.src.lines ?? 1e9) - (b.src.lines ?? 1e9));
    for (const { lang, version, src } of order) {
      const pair = key(lang.slug, version);
      const col = document.createElement("section");
      col.className = "col";

      const head = document.createElement("div");
      head.className = "col-head";
      const info = document.createElement("div");
      const title = document.createElement("div");
      title.className = "col-title";
      title.textContent = `${lang.name} · ${t[version]}`;
      const meta1 = document.createElement("div");
      meta1.className = "col-meta";
      meta1.textContent = t.metadata(lang.year, lang.designer);
      const meta2 = document.createElement("div");
      meta2.className = "col-meta";
      meta2.textContent = t.stats(src.lines ?? "-", src.chars ?? "-");
      info.append(title, meta1, meta2);
      const close = document.createElement("button");
      close.className = "col-close";
      close.textContent = t.close;
      close.setAttribute("aria-label", t.remove(`${lang.name} ? ${t[version]}`));
      close.addEventListener("click", () => {
        state.selected = state.selected.filter((s) => s !== pair);
        update();
      });
      head.append(logoEl(lang), info, close);

      const code = src.code.replace(/\n$/, "");
      // Match the code font and include both pre paddings, gutter border and card borders.
      const longest = Math.max(...code.split("\n").map((line) => line.replace(/\t/g, "        ").length));
      const digits = String(code.split("\n").length).length;
      col.style.setProperty("--code-width", `calc(${longest + digits + 1}ch + 51px)`);
      const box = document.createElement("div");
      box.className = "code";
      const gutter = document.createElement("pre");
      gutter.className = "gutter";
      gutter.textContent = code.split("\n").map((_, i) => i + 1).join("\n");
      const pre = document.createElement("pre");
      const el = document.createElement("code");
      el.className = "hljs";
      if (window.hljs && lang.hljs && hljs.getLanguage(lang.hljs)) {
        el.innerHTML = hljs.highlight(code, { language: lang.hljs, ignoreIllegals: true }).value;
      } else {
        el.textContent = code;
      }
      pre.append(el);
      box.append(gutter, pre);

      const file = document.createElement("div");
      file.className = "file";
      file.textContent = src.file;

      col.append(head, box, file);
      cols.append(col);
    }
    document.getElementById("empty").hidden = order.length > 0;
    document.getElementById("count").textContent = t.count(order.length, LANGS.length * VERSIONS.length);
  }

  function renderToolbar() {
    for (const b of document.querySelectorAll("#sort button"))
      b.setAttribute("aria-pressed", String(b.dataset.s === state.sort));
  }

  function update() {
    writeHash();
    renderToolbar();
    renderPicker();
    renderColumns();
  }

  document.getElementById("sort").addEventListener("click", (e) => {
    const s = e.target.closest("button")?.dataset.s;
    if (s) { state.sort = s; update(); }
  });
  for (const version of VERSIONS) {
    document.getElementById(`all-${version}`).addEventListener("click", () => {
      state.selected = [...new Set([...state.selected, ...LANGS.map((lang) => key(lang.slug, version))])];
      update();
    });
  }
  document.getElementById("all").addEventListener("click", () => {
    state.selected = LANGS.flatMap((lang) => VERSIONS.map((v) => key(lang.slug, v)));
    update();
  });
  document.getElementById("clear").addEventListener("click", () => {
    state.selected = [];
    update();
  });
  window.addEventListener("hashchange", () => { readHash(); update(); });

  readHash();
  update();
})();
</script>
</body>
</html>
